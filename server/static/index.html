<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RustSync</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: #f5f5f5; color: #333;
        }
        .container { text-align: center; padding: 40px; }
        h1 { font-size: 2em; margin-bottom: 16px; color: #1a73e8; }
        p { color: #666; margin-bottom: 24px; }
        .status { display: inline-block; padding: 8px 16px; border-radius: 20px;
            background: #e8f5e9; color: #2e7d32; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>RustSync</h1>
        <p>自动化存储同步服务</p>
        <div class="status">Rust 后端已运行</div>
        <p style="margin-top:20px; font-size: 12px; color: #999;">
            前端构建产物请放入 static/ 目录
        </p>
    </div>
</body>
</html>
