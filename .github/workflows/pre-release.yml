name: Pre-release v1.1.0

# Auto-build pre-release on every push to main

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    env:
      APP_NAME: RustSync
      PRE_VERSION: 1.1.0
      PRE_TAG: v1.1.0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: rustsync/web/package-lock.json
      - name: Build Frontend
        working-directory: rustsync/web
        run: |
          sed -i "s/__version_placeholder__/$PRE_VERSION/g" src/locales/zh-CN.yaml
          sed -i "s/__version_placeholder__/$PRE_VERSION/g" src/locales/en.yaml
          npm ci
          npm run build
      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: rustsync/web/dist
          retention-days: 1

  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [build-frontend]
    continue-on-error: true
    env:
      APP_NAME: RustSync
      PRE_VERSION: 1.1.0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Download Frontend
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: rustsync/web/dist
      - name: Prepare Frontend
        run: |
          cd rustsync
          rm -rf front
          cp -r web/dist front
          test -f front/index.html
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk
          rustup target add aarch64-linux-android
      - name: Copy Frontend to Rust static
        run: |
          mkdir -p server/static
          cp -r rustsync/front/* server/static/
      - name: Build Rust (arm64-v8a)
        working-directory: server
        run: |
          cargo ndk --target aarch64-linux-android --platform 21 -- build --release
          mkdir -p ../rustsync/bin/arm64-v8a
          cp target/aarch64-linux-android/release/rustsync-server ../rustsync/bin/arm64-v8a/rustsync_server
      - name: Verify Rust Binary
        run: |
          file rustsync/bin/arm64-v8a/rustsync_server
          test -f rustsync/bin/arm64-v8a/rustsync_server
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev libsqlite3-dev libbz2-dev libreadline-dev libltdl-dev libtool-bin ccache git wget unzip zip openjdk-17-jdk build-essential
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.5.0" "python-for-android==2024.01.21" "Cython==0.29.34" virtualenv
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-v2-p4a2024.01.21-py311-${{ hashFiles('rustsync/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-v2-p4a2024.01.21-py311-
      - name: Build Android Debug APK
        working-directory: rustsync
        run: |
          PYTHONWARNINGS="ignore:Unable to find acceptable character detection:UserWarning" buildozer -v android debug
      - name: Package APK
        run: |
          mkdir -p dist
          apk_path=$(find rustsync/bin -maxdepth 1 -name '*.apk' -print -quit)
          if [ -z "$apk_path" ]; then echo "::error::APK not found"; exit 1; fi
          cp "$apk_path" "dist/${APP_NAME}-app-${PRE_VERSION}.apk"
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 1

  build-android-magisk:
    name: Build Android Magisk (arm64-v8a)
    runs-on: ubuntu-latest
    needs: [build-frontend]
    continue-on-error: true
    env:
      APP_NAME: RustSync
      PRE_VERSION: 1.1.0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Download Frontend
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: rustsync/web/dist
      - name: Copy Frontend to static
        run: |
          mkdir -p server/static
          cp -r rustsync/web/dist/* server/static/
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk
          rustup target add aarch64-linux-android
      - name: Build Rust (arm64-v8a)
        working-directory: server
        run: |
          cargo ndk --target aarch64-linux-android --platform 21 -- build --release
          mkdir -p ../dist/bin/arm64-v8a
          cp target/aarch64-linux-android/release/rustsync-server ../dist/bin/arm64-v8a/rustsync_server
      - name: Verify Rust Binary
        run: |
          file dist/bin/arm64-v8a/rustsync_server
          test -f dist/bin/arm64-v8a/rustsync_server
      - name: Package Magisk Module
        run: |
          MAGISK_TMP=$(mktemp -d)
          cp module.prop customize.sh service.sh "$MAGISK_TMP/"
          cp -r META-INF "$MAGISK_TMP/"
          mkdir -p "$MAGISK_TMP/system/bin"
          cp dist/bin/arm64-v8a/rustsync_server "$MAGISK_TMP/system/bin/rustsync_server"
          mkdir -p "$MAGISK_TMP/static"
          cp -r server/static/* "$MAGISK_TMP/static/"
          sed -i "s/^version=.*/version=${PRE_VERSION}/" "$MAGISK_TMP/module.prop"
          VERSION_CODE=$(echo "$PRE_VERSION" | tr -d '.')
          sed -i "s/^versionCode=.*/versionCode=${VERSION_CODE}/" "$MAGISK_TMP/module.prop"
          (cd "$MAGISK_TMP" && mkdir -p "$GITHUB_WORKSPACE/dist" && zip -qr "$GITHUB_WORKSPACE/dist/${APP_NAME}-Magisk-${PRE_VERSION}.zip" .)
          rm -rf "$MAGISK_TMP"
      - name: Upload Magisk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-magisk
          path: dist/RustSync-Magisk-*.zip
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [build-frontend]
    continue-on-error: true
    env:
      APP_NAME: RustSync
      PRE_VERSION: 1.1.0
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Download Frontend
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: rustsync/web/dist
      - name: Copy Frontend to static
        run: |
          mkdir -p server/static
          cp -r rustsync/web/dist/* server/static/
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl-tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then cargo install cross; fi
      - name: Build Rust
        working-directory: server
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Package
        run: |
          mkdir -p dist
          bin_name="${APP_NAME}-${PRE_VERSION}-linux-${{ matrix.arch }}"
          cp server/target/${{ matrix.target }}/release/rustsync-server "dist/${bin_name}"
          cd dist && tar czf "../${bin_name}.tar.gz" "${bin_name}" && cd ..
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: RustSync-1.1.0-linux-${{ matrix.arch }}.tar.gz
          retention-days: 1

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [build-frontend]
    continue-on-error: true
    env:
      APP_NAME: RustSync
      PRE_VERSION: 1.1.0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Download Frontend
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: rustsync/web/dist
      - name: Copy Frontend to static
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path server/static
          Copy-Item -Recurse rustsync/web/dist/* server/static/
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build Rust
        working-directory: server
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $exeName = "$env:APP_NAME-$env:PRE_VERSION-windows-amd64.exe"
          Copy-Item server/target/x86_64-pc-windows-msvc/release/rustsync-server.exe "dist/$exeName"
          Compress-Archive -Path "dist/$exeName" -DestinationPath "$env:APP_NAME-$env:PRE_VERSION-windows-amd64.zip"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows-amd64
          path: RustSync-1.1.0-windows-amd64.zip
          retention-days: 1

  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: [build-frontend]
    continue-on-error: true
    timeout-minutes: 30
    env:
      APP_NAME: RustSync
      PRE_VERSION: 1.1.0
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: amd64
            runner: macos-latest
          - target: aarch64-apple-darwin
            arch: arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Download Frontend
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: rustsync/web/dist
      - name: Copy Frontend to static
        run: |
          mkdir -p server/static
          cp -r rustsync/web/dist/* server/static/
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build Rust
        working-directory: server
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          bin_name="${APP_NAME}-${PRE_VERSION}-darwin-${{ matrix.arch }}"
          cp server/target/${{ matrix.target }}/release/rustsync-server "dist/${bin_name}"
          cd dist && tar czf "../${bin_name}.tar.gz" "${bin_name}" && cd ..
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-darwin-${{ matrix.arch }}
          path: RustSync-1.1.0-darwin-${{ matrix.arch }}.tar.gz
          retention-days: 1

  build-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DOCKER_USER: ojbkxc
      DOCKER_NAME: rustsync
      PRE_VERSION: 1.1.0
      PRE_TAG: v1.1.0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./rustsync/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ojbkxc/rustsync:v1.1.0
            ojbkxc/rustsync:1.1.0
            ojbkxc/rustsync:latest
          labels: |
            org.opencontainers.image.version=1.1.0
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_VERSION=v1.1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-pre-release:
    name: Publish Pre-release v1.1.0
    runs-on: ubuntu-latest
    needs: [build-android-apk, build-android-magisk, build-linux, build-windows, build-macos, build-docker]
    if: (!cancelled())
    env:
      APP_NAME: RustSync
      PRE_VERSION: 1.1.0
      PRE_TAG: v1.1.0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
        continue-on-error: true
      - name: List Artifacts
        run: |
          echo "=== Available Artifacts ==="
          find dist -type f 2>/dev/null | sort || echo "  (none)"
      - name: Collect Artifact Files
        id: collect
        run: |
          cp docker-compose.yml dist/docker-compose.yml
          { echo "files<<EOF"; find dist -type f \( -name "*.apk" -o -name "*.zip" -o -name "*.tar.gz" -o -name "docker-compose.yml" \) 2>/dev/null || true; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - name: Update Tag
        if: steps.collect.outputs.files != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin :refs/tags/$PRE_TAG 2>/dev/null || true
          git tag -f $PRE_TAG -m "Pre-release $PRE_TAG"
          git push origin $PRE_TAG
      - name: Create/Update Pre-release
        if: steps.collect.outputs.files != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: RustSync v1.1.0 (Pre-release)
          body: |
            ## RustSync 1.1.0 Pre-release
            Auto-built pre-release, updated on every push to main.
            ### Included
            - APK, Magisk, Linux (amd64/arm64), Windows (amd64), macOS (x86_64/arm64)
            - Docker: ojbkxc/rustsync:1.1.0 / ojbkxc/rustsync:latest
            - docker-compose.yml
            ### Defaults
            - Port: 8023
            - Password: admin
          files: ${{ steps.collect.outputs.files }}
          draft: false
          prerelease: true
