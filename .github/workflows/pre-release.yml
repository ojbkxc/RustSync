name: Pre-release

# Auto-build pre-release on every push to main
# Trigger CI for current code verification v5 (naming conventions aligned)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    env:
      APP_NAME: RustSync
      PRE_VERSION: 1.1.0
      PRE_TAG: v1.1.0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: rustsync/web/package-lock.json
      - name: Build Frontend
        working-directory: rustsync/web
        run: |
          sed -i "s/__version_placeholder__/$PRE_VERSION/g" src/locales/zh-CN.yaml
          sed -i "s/__version_placeholder__/$PRE_VERSION/g" src/locales/en.yaml
          npm ci
          npm run build
      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: rustsync/web/dist
          retention-days: 1
