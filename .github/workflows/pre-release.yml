name: Pre-release v1.1.0

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: RustSync
  PRE_VERSION: 1.1.0
  PRE_TAG: v1.1.0
  DOCKER_USER: ojbkxc
  DOCKER_NAME: rustsync

jobs:
  # ============================================================
  # 构建前端（所有平台共享）
  # ============================================================
  build-frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: rustsync/web/package-lock.json

      - name: 构建前端
        working-directory: rustsync/web
        env:
          VERSION: ${{ env.PRE_VERSION }}
        run: |
          sed -i "s/__version_placeholder__/$VERSION/g" src/locales/zh-CN.yaml
          sed -i "s/__version_placeholder__/$VERSION/g" src/locales/en.yaml
          npm ci
          npm run build

      - name: 上传前端 artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: rustsync/web/dist
          retention-days: 1

  # ============================================================
  # Android APK (arm64-v8a)
  # ============================================================
  build-android-apk:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    needs: [build-frontend]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 下载前端
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: rustsync/web/dist

      - name: 准备前端资源
        run: |
          cd rustsync
          rm -rf front
          cp -r web/dist front
          test -f front/index.html

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk
          rustup target add aarch64-linux-android

      - name: 复制前端到 Rust static
        run: |
          mkdir -p server/static
          cp -r rustsync/front/* server/static/

      - name: 构建 Rust (arm64-v8a)
        working-directory: server
        run: |
          cargo ndk --target aarch64-linux-android --platform 21 -- build --release
          mkdir -p ../rustsync/bin/arm64-v8a
          cp target/aarch64-linux-android/release/rustsync-server ../rustsync/bin/arm64-v8a/rustsync_server
          echo "arm64-v8a built"

      - name: 验证 Rust 二进制
        run: |
          file rustsync/bin/arm64-v8a/rustsync_server
          test -f rustsync/bin/arm64-v8a/rustsync_server

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev libsqlite3-dev libbz2-dev libreadline-dev \
            libltdl-dev libtool-bin \
            ccache git wget unzip zip \
            openjdk-17-jdk build-essential
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: 安装 Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.5.0" "python-for-android==2024.01.21" "Cython==0.29.34" virtualenv

      - name: 缓存 Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-v2-p4a2024.01.21-py311-${{ hashFiles('rustsync/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-v2-p4a2024.01.21-py311-

      - name: 编译 Android Debug APK
        working-directory: rustsync
        run: |
          PYTHONWARNINGS="ignore:Unable to find acceptable character detection:UserWarning" buildozer -v android debug

      - name: 整理 APK 产物
        run: |
          mkdir -p dist
          apk_path=$(find rustsync/bin -maxdepth 1 -name '*.apk' -print -quit)
          if [ -z "$apk_path" ]; then
            echo "::error::未找到 APK 产物"
            exit 1
          fi
          cp "$apk_path" "dist/${APP_NAME}-app-${{ env.PRE_VERSION }}.apk"
          echo "APK: dist/${APP_NAME}-app-${{ env.PRE_VERSION }}.apk"

      - name: 上传 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 1

  # ============================================================
  # Android Magisk 模块 (arm64-v8a)
  # ============================================================
  build-android-magisk:
    name: 构建 Android Magisk (arm64-v8a)
    runs-on: ubuntu-latest
    needs: [build-frontend]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 下载前端
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: rustsync/web/dist

      - name: 复制前端到 static
        run: |
          mkdir -p server/static
          cp -r rustsync/web/dist/* server/static/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk
          rustup target add aarch64-linux-android

      - name: 构建 Rust (arm64-v8a)
        working-directory: server
        run: |
          cargo ndk --target aarch64-linux-android --platform 21 -- build --release
          mkdir -p ../dist/bin/arm64-v8a
          cp target/aarch64-linux-android/release/rustsync-server ../dist/bin/arm64-v8a/rustsync_server
          echo "arm64-v8a built"

      - name: 验证 Rust 二进制
        run: |
          file dist/bin/arm64-v8a/rustsync_server
          test -f dist/bin/arm64-v8a/rustsync_server

      - name: 打包 Magisk 模块
        run: |
          MAGISK_TMP=$(mktemp -d)
          cp module.prop customize.sh service.sh "$MAGISK_TMP/"
          cp -r META-INF "$MAGISK_TMP/"

          mkdir -p "$MAGISK_TMP/system/bin"
          cp dist/bin/arm64-v8a/rustsync_server "$MAGISK_TMP/system/bin/rustsync_server"

          mkdir -p "$MAGISK_TMP/static"
          cp -r server/static/* "$MAGISK_TMP/static/"

          sed -i "s/^version=.*/version=${{ env.PRE_VERSION }}/" "$MAGISK_TMP/module.prop"
          VERSION_CODE=$(echo "${{ env.PRE_VERSION }}" | tr -d '.')
          sed -i "s/^versionCode=.*/versionCode=${VERSION_CODE}/" "$MAGISK_TMP/module.prop"

          (cd "$MAGISK_TMP" && mkdir -p "$GITHUB_WORKSPACE/dist" && zip -qr "$GITHUB_WORKSPACE/dist/${APP_NAME}-${{ env.PRE_VERSION }}.zip" .)
          rm -rf "$MAGISK_TMP"
          echo "Magisk: dist/${APP_NAME}-${{ env.PRE_VERSION }}.zip"

      - name: 上传 Magisk artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-magisk
          path: dist/${{ env.APP_NAME }}-*.zip
          if-no-files-found: error
          retention-days: 1

  # ============================================================
  # Linux 独立二进制 (amd64 + arm64, musl 静态链接)
  # ============================================================
  build-linux:
    name: 构建 Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [build-frontend]
    continue-on-error: true
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 下载前端
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: rustsync/web/dist

      - name: 复制前端到 static
        run: |
          mkdir -p server/static
          cp -r rustsync/web/dist/* server/static/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 musl-tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cargo install cross
          fi

      - name: 构建 Rust
        working-directory: server
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: 打包
        run: |
          mkdir -p dist
          cp server/target/${{ matrix.target }}/release/rustsync-server dist/rustsync-server
          cd dist
          tar czf "../${APP_NAME}-${{ env.PRE_VERSION }}-linux-${{ matrix.arch }}.tar.gz" rustsync-server
          cd ..

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: ${{ env.APP_NAME }}-${{ env.PRE_VERSION }}-linux-${{ matrix.arch }}.tar.gz
          retention-days: 1

  # ============================================================
  # Windows 独立二进制 (amd64)
  # ============================================================
  build-windows:
    name: 构建 Windows
    runs-on: windows-latest
    needs: [build-frontend]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 下载前端
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: rustsync/web/dist

      - name: 复制前端到 static
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path server/static
          Copy-Item -Recurse rustsync/web/dist/* server/static/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 构建 Rust
        working-directory: server
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: 打包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item server/target/x86_64-pc-windows-msvc/release/rustsync-server.exe dist/rustsync-server.exe
          Compress-Archive -Path dist/rustsync-server.exe -DestinationPath "$env:APP_NAME-${{ env.PRE_VERSION }}-windows-amd64.zip"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows-amd64
          path: ${{ env.APP_NAME }}-${{ env.PRE_VERSION }}-windows-amd64.zip
          retention-days: 1

  # ============================================================
  # macOS 独立二进制 (amd64 + arm64)
  # ============================================================
  build-macos:
    name: 构建 macOS (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: [build-frontend]
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: amd64
            runner: macos-latest
          - target: aarch64-apple-darwin
            arch: arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 下载前端
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: rustsync/web/dist

      - name: 复制前端到 static
        run: |
          mkdir -p server/static
          cp -r rustsync/web/dist/* server/static/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 构建 Rust
        working-directory: server
        run: cargo build --release --target ${{ matrix.target }}

      - name: 打包
        run: |
          mkdir -p dist
          cp server/target/${{ matrix.target }}/release/rustsync-server dist/rustsync-server
          cd dist
          tar czf "../${APP_NAME}-${{ env.PRE_VERSION }}-darwin-${{ matrix.arch }}.tar.gz" rustsync-server
          cd ..

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-darwin-${{ matrix.arch }}
          path: ${{ env.APP_NAME }}-${{ env.PRE_VERSION }}-darwin-${{ matrix.arch }}.tar.gz
          retention-days: 1

  # ============================================================
  # Docker 镜像构建并推送
  # ============================================================
  build-docker:
    name: 构建并推送 Docker 镜像
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./rustsync/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/${{ env.DOCKER_NAME }}:${{ env.PRE_TAG }}
            ${{ env.DOCKER_USER }}/${{ env.DOCKER_NAME }}:${{ env.PRE_VERSION }}
            ${{ env.DOCKER_USER }}/${{ env.DOCKER_NAME }}:latest
          labels: |
            org.opencontainers.image.version=${{ env.PRE_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ env.PRE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 创建 Pre-release（合并 Build & Release + Magisk + Docker）
  # ============================================================
  create-pre-release:
    name: 发布 Pre-release v1.1.0
    runs-on: ubuntu-latest
    needs: [build-android-apk, build-android-magisk, build-linux, build-windows, build-macos, build-docker]
    if: (!cancelled())
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
        continue-on-error: true

      - name: 列出产物
        run: |
          echo "=== 可用产物 ==="
          find dist -type f 2>/dev/null | sort || echo "  (无产物)"

      - name: 收集产物文件
        id: collect
        run: |
          {
            echo "files<<EOF"
            find dist -type f \( -name "*.apk" -o -name "*.zip" -o -name "*.tar.gz" \) 2>/dev/null || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 更新 tag
        if: steps.collect.outputs.files != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 删除远程已有 tag
          git push origin :refs/tags/${{ env.PRE_TAG }} 2>/dev/null || true

          # 强制创建新 tag
          git tag -f ${{ env.PRE_TAG }} -m "Pre-release ${{ env.PRE_TAG }}"
          git push origin ${{ env.PRE_TAG }}

      - name: 创建 / 更新 Pre-release
        if: steps.collect.outputs.files != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PRE_TAG }}
          name: RustSync ${{ env.PRE_TAG }} (Pre-release)
          body: |
            ## RustSync ${{ env.PRE_VERSION }} Pre-release

            自动构建的预发布版本，每次推送 main 分支时自动更新。

            ### 包含产物
            - **Build & Release**: Android APK、Magisk 模块、Linux (amd64/arm64)、Windows (amd64)、macOS (x86_64/arm64)
            - **Magisk**: RustSync 面具模块刷入包
            - **Docker Hub**: `ojbkxc/rustsync:1.1.0` / `ojbkxc/rustsync:latest` (linux/amd64, linux/arm64)

            ### 使用
            - **APK**: 安装 `RustSync-app-1.1.0.apk`，WebView 自动加载管理面板
            - **Magisk**: 下载 `RustSync-1.1.0.zip` 通过 Magisk 刷入
            - **Linux/macOS**: `tar xzf` 解压后运行 `./rustsync-server`
            - **Windows**: 解压后运行 `rustsync-server.exe`
            - **Docker**: `docker pull ojbkxc/rustsync:latest`

            ### 默认
            - 端口: `8023`
            - 密码: `admin`

            > 此版本随 main 分支推送自动更新，构建时间: ${{ github.event.head_commit.timestamp || 'N/A' }}
          files: ${{ steps.collect.outputs.files }}
          draft: false
          prerelease: true