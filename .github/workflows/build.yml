name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v1.0.1)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Update version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG_VERSION="${{ github.event.inputs.version }}"
          else
            TAG_VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "tag=$TAG_VERSION" >> $GITHUB_OUTPUT

          VERSION=${TAG_VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          IFS='.' read -ra PARTS <<< "$VERSION"
          VERSION_CODE=0
          for i in "${!PARTS[@]}"; do
            MULT=$((10 ** (6 - i * 3)))
            VERSION_CODE=$((VERSION_CODE + PARTS[i] * MULT))
          done
          echo "versionCode=$VERSION_CODE" >> $GITHUB_OUTPUT

          sed -i "s/^version=.*/version=$VERSION/" module.prop
          sed -i "s/^versionCode=.*/versionCode=$VERSION_CODE/" module.prop

          echo "Updated to $TAG_VERSION (code: $VERSION_CODE)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: rustsync/web/package-lock.json

      - name: Build frontend
        working-directory: rustsync/web
        run: |
          VERSION=${{ steps.version.outputs.version }}
          sed -i "s/__version_placeholder__/$VERSION/g" src/locales/zh-CN.yaml
          sed -i "s/__version_placeholder__/$VERSION/g" src/locales/en.yaml
          npm ci
          npm run build
          echo "Frontend built"

      - name: Prepare frontend for packaging
        run: |
          cd rustsync
          rm -rf front
          cp -r web/dist front
          test -f front/index.html
          echo "Frontend copied to front/"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk
          rustup target add aarch64-linux-android

      - name: Copy frontend to Rust static directory
        run: |
          mkdir -p server/static
          cp -r rustsync/front/* server/static/
          echo "Frontend copied to server/static/"

      - name: Build Rust server (aarch64)
        working-directory: server
        run: |
          cargo ndk --target aarch64-linux-android --platform 21 -- build --release
          mkdir -p ../system/bin
          cp target/aarch64-linux-android/release/rustsync-server ../system/bin/rustsync_server
          echo "Rust binary built: rustsync_server"

      - name: Package static files for Magisk
        run: |
          mkdir -p static
          cp -r rustsync/front/* static/
          echo "Static files packaged for Magisk module"

      - name: Verify build artifact
        run: |
          if [ ! -f "system/bin/rustsync_server" ]; then
            echo "::error::Rust 二进制构建产物不存在"
            exit 1
          fi
          echo "Rust 二进制已构建: system/bin/rustsync_server"
          if [ -d "static" ] && [ "$(ls -A static 2>/dev/null)" ]; then
            echo "前端静态文件已打包"
          fi
          echo "构建产物验证通过"

      - name: Package
        run: |
          VERSION=${{ steps.version.outputs.version }}
          zip -r RustSync-Magisk-${VERSION}.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".gitignore" \
            -x ".gitmodules" \
            -x "rustsync/*" \
            -x "server/src/*" \
            -x "server/target/*" \
            -x "server/Cargo.*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustSync-Magisk-${{ steps.version.outputs.version }}
          path: RustSync-Magisk-${{ steps.version.outputs.version }}.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: RustSync ${{ steps.version.outputs.tag }}
          body: |
            ## RustSync ${{ steps.version.outputs.version }}

            Rust 重写版 Magisk 模块，开机自启动 RustSync 同步服务。

            ### 功能
            - 开机自启动 RustSync 同步服务
            - 进程守护（崩溃自动重启）
            - Web 管理面板 (端口 8023)
            - 默认密码 `admin`
            - 支持 Magisk v20.4+

            ### 安装
            1. 下载 `RustSync-Magisk-${{ steps.version.outputs.version }}.zip`
            2. 通过 Magisk 刷入
            3. 重启设备
            4. 浏览器访问 `http://设备IP:8023`

            ### 配置
            - 配置目录：`/data/adb/rustsync/data/`
            - 日志文件：`/data/adb/rustsync/rustsync.log`
          files: RustSync-Magisk-${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: false