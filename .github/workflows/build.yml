name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v1.0.1)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

env:
  APP_NAME: RustSync

jobs:
  # ============================================================
  # 获取版本号
  # ============================================================
  get-version:
    name: 获取版本号
    runs-on: ubuntu-latest
    if: github.ref != 'refs/tags/v1.1.0'  # v1.1.0 由 pre-release workflow 处理
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 确定版本号
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG_VERSION="${{ github.event.inputs.version }}"
          else
            TAG_VERSION=${GITHUB_REF#refs/tags/}
          fi
          VERSION=${TAG_VERSION#v}
          echo "tag=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $TAG_VERSION ($VERSION)"

  # ============================================================
  # 构建前端（所有平台共享）
  # ============================================================
  build-frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    needs: [get-version]
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: rustsync/web/package-lock.json

      - name: 构建前端
        working-directory: rustsync/web
        run: |
          sed -i "s/__version_placeholder__/$VERSION/g" src/locales/zh-CN.yaml
          sed -i "s/__version_placeholder__/$VERSION/g" src/locales/en.yaml
          npm ci
          npm run build

      - name: 上传前端 artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: rustsync/web/dist
          retention-days: 1

  # ============================================================
  # Android APK (arm64-v8a)
  # ============================================================
  build-android-apk:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    needs: [get-version, build-frontend]
    continue-on-error: true
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 下载前端
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: rustsync/web/dist

      - name: 准备前端资源
        run: |
          cd rustsync
          rm -rf front
          cp -r web/dist front
          test -f front/index.html

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk
          rustup target add aarch64-linux-android

      - name: 复制前端到 Rust static
        run: |
          mkdir -p server/static
          cp -r rustsync/front/* server/static/

      - name: 构建 Rust (arm64-v8a)
        working-directory: server
        run: |
          cargo ndk --target aarch64-linux-android --platform 21 -- build --release
          mkdir -p ../rustsync/bin/arm64-v8a
          cp target/aarch64-linux-android/release/rustsync-server ../rustsync/bin/arm64-v8a/rustsync_server
          echo "arm64-v8a built"


      - name: 验证 Rust 二进制
        run: |
          file rustsync/bin/arm64-v8a/rustsync_server
          test -f rustsync/bin/arm64-v8a/rustsync_server

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev libsqlite3-dev libbz2-dev libreadline-dev \
            libltdl-dev libtool-bin \
            ccache git wget unzip zip \
            openjdk-17-jdk build-essential
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: 安装 Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.5.0" "python-for-android==2024.01.21" "Cython==0.29.34" virtualenv

      - name: 缓存 Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-v2-p4a2024.01.21-py311-${{ hashFiles('rustsync/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-v2-p4a2024.01.21-py311-

      - name: 编译 Android Debug APK
        working-directory: rustsync
        run: |
          PYTHONWARNINGS="ignore:Unable to find acceptable character detection:UserWarning" buildozer -v android debug

      - name: 整理 APK 产物
        run: |
          mkdir -p dist
          apk_path=$(find rustsync/bin -maxdepth 1 -name '*.apk' -print -quit)
          if [ -z "$apk_path" ]; then
            echo "::error::未找到 APK 产物"
            exit 1
          fi
          cp "$apk_path" "dist/${APP_NAME}-app-${VERSION}.apk"
          echo "APK: dist/${APP_NAME}-app-${VERSION}.apk"

      - name: 上传 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 1

  # ============================================================
  # Android Magisk 模块 (arm64-v8a, Rust 原生二进制)
  # ============================================================
  build-android-magisk:
    name: 构建 Android Magisk (arm64-v8a)
    runs-on: ubuntu-latest
    needs: [get-version, build-frontend]
    continue-on-error: true
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 下载前端
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: rustsync/web/dist

      - name: 复制前端到 static
        run: |
          mkdir -p server/static
          cp -r rustsync/web/dist/* server/static/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk
          rustup target add aarch64-linux-android

      - name: 构建 Rust (arm64-v8a)
        working-directory: server
        run: |
          cargo ndk --target aarch64-linux-android --platform 21 -- build --release
          mkdir -p ../dist/bin/arm64-v8a
          cp target/aarch64-linux-android/release/rustsync-server ../dist/bin/arm64-v8a/rustsync_server
          echo "arm64-v8a built"

      - name: 验证 Rust 二进制
        run: |
          file dist/bin/arm64-v8a/rustsync_server
          test -f dist/bin/arm64-v8a/rustsync_server

      - name: 打包 Magisk 模块
        run: |
          MAGISK_TMP=$(mktemp -d)
          cp module.prop customize.sh service.sh "$MAGISK_TMP/"
          cp -r META-INF "$MAGISK_TMP/"

          mkdir -p "$MAGISK_TMP/system/bin"
          cp dist/bin/arm64-v8a/rustsync_server "$MAGISK_TMP/system/bin/rustsync_server"

          mkdir -p "$MAGISK_TMP/static"
          cp -r server/static/* "$MAGISK_TMP/static/"

          # 更新 module.prop
          sed -i "s/^version=.*/version=${VERSION}/" "$MAGISK_TMP/module.prop"
          VERSION_CODE=$(echo "$VERSION" | tr -d '.')
          sed -i "s/^versionCode=.*/versionCode=${VERSION_CODE}/" "$MAGISK_TMP/module.prop"

          (cd "$MAGISK_TMP" && mkdir -p "$GITHUB_WORKSPACE/dist" && zip -qr "$GITHUB_WORKSPACE/dist/${APP_NAME}-Magisk-${VERSION}.zip" .)
          rm -rf "$MAGISK_TMP"
          echo "Magisk: dist/${APP_NAME}-Magisk-${VERSION}.zip"

      - name: 上传 Magisk artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-magisk
          path: dist/RustSync-Magisk-*.zip
          if-no-files-found: error
          retention-days: 1

  # ============================================================
  # Linux 独立二进制 (amd64 + arm64, musl 静态链接)
  # ============================================================
  build-linux:
    name: 构建 Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [get-version, build-frontend]
    continue-on-error: true
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 下载前端
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: rustsync/web/dist

      - name: 复制前端到 static
        run: |
          mkdir -p server/static
          cp -r rustsync/web/dist/* server/static/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 musl-tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y musl-tools
          # aarch64 musl 交叉编译使用 cross (docker-based)
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cargo install cross
          fi

      - name: 构建 Rust
        working-directory: server
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: 打包
        run: |
          mkdir -p dist
          bin_name="${APP_NAME}-${VERSION}-linux-${{ matrix.arch }}"
          cp server/target/${{ matrix.target }}/release/rustsync-server "dist/${bin_name}"
          cd dist
          tar czf "../${bin_name}.tar.gz" "${bin_name}"
          cd ..

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: RustSync-${{ needs.get-version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
          retention-days: 1

  # ============================================================
  # Windows 独立二进制 (amd64)
  # ============================================================
  build-windows:
    name: 构建 Windows
    runs-on: windows-latest
    needs: [get-version, build-frontend]
    continue-on-error: true
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 下载前端
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: rustsync/web/dist

      - name: 复制前端到 static
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path server/static
          Copy-Item -Recurse rustsync/web/dist/* server/static/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 构建 Rust
        working-directory: server
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: 打包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $exeName = "$env:APP_NAME-$env:VERSION-windows-amd64.exe"
          Copy-Item server/target/x86_64-pc-windows-msvc/release/rustsync-server.exe "dist/$exeName"
          Compress-Archive -Path "dist/$exeName" -DestinationPath "$env:APP_NAME-$env:VERSION-windows-amd64.zip"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows-amd64
          path: RustSync-${{ needs.get-version.outputs.version }}-windows-amd64.zip
          retention-days: 1

  # ============================================================
  # macOS 独立二进制 (amd64 + arm64)
  # ============================================================
  build-macos:
    name: 构建 macOS (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: [get-version, build-frontend]
    continue-on-error: true  # macOS runner 可能不可用，不阻塞发版
    timeout-minutes: 30  # runner 排队超时则取消，避免卡死整个流程
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: amd64
            runner: macos-latest
          - target: aarch64-apple-darwin
            arch: arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 下载前端
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: rustsync/web/dist

      - name: 复制前端到 static
        run: |
          mkdir -p server/static
          cp -r rustsync/web/dist/* server/static/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 构建 Rust
        working-directory: server
        run: cargo build --release --target ${{ matrix.target }}

      - name: 打包
        run: |
          mkdir -p dist
          bin_name="${APP_NAME}-${VERSION}-darwin-${{ matrix.arch }}"
          cp server/target/${{ matrix.target }}/release/rustsync-server "dist/${bin_name}"
          cd dist
          tar czf "../${bin_name}.tar.gz" "${bin_name}"
          cd ..

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-darwin-${{ matrix.arch }}
          path: RustSync-${{ needs.get-version.outputs.version }}-darwin-${{ matrix.arch }}.tar.gz
          retention-days: 1

  # ============================================================
  # 创建 GitHub Release
  # ============================================================
  create-release:
    name: 发布 Release
    runs-on: ubuntu-latest
    needs: [get-version, build-android-apk, build-android-magisk, build-linux, build-windows, build-macos]
    if: (!cancelled()) && github.ref != 'refs/tags/v1.1.0'  # 即使部分平台构建失败也继续发版；v1.1.0 由 pre-release workflow 处理
    env:
      TAG: ${{ needs.get-version.outputs.tag }}
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
        continue-on-error: true  # 部分平台构建失败时，产物可能不存在

      - name: 列出产物
        run: |
          echo "=== 可用产物 ==="
          find dist -type f 2>/dev/null | sort || echo "  (无产物)"

      - name: 收集产物文件
        id: collect
        run: |
          # 复制 docker-compose.yml 到 dist 目录
          cp docker-compose.yml dist/docker-compose.yml
          {
            echo "files<<EOF"
            find dist -type f \( -name "*.apk" -o -name "*.zip" -o -name "*.tar.gz" -o -name "docker-compose.yml" \) 2>/dev/null || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 创建 Release
        if: steps.collect.outputs.files != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-version.outputs.tag }}
          name: RustSync ${{ needs.get-version.outputs.tag }}
          body: |
            ## RustSync ${{ needs.get-version.outputs.version }}

            Rust 重写版多平台同步服务。

            ### 产物
            - **APK**: `RustSync-app-${{ needs.get-version.outputs.version }}.apk`
            - **Magisk**: `RustSync-Magisk-${{ needs.get-version.outputs.version }}.zip` (通过 Magisk 刷入)
            - **Linux**: `RustSync-${{ needs.get-version.outputs.version }}-linux-amd64.tar.gz` / `RustSync-${{ needs.get-version.outputs.version }}-linux-arm64.tar.gz`
            - **Windows**: `RustSync-${{ needs.get-version.outputs.version }}-windows-amd64.zip`
            - **macOS**: `RustSync-${{ needs.get-version.outputs.version }}-darwin-amd64.tar.gz` / `RustSync-${{ needs.get-version.outputs.version }}-darwin-arm64.tar.gz`
            - **Docker**: `docker-compose.yml`

            ### 使用
            - **APK**: 安装后打开 App，WebView 自动加载管理面板
            - **Magisk**: 下载 `RustSync-Magisk-${{ needs.get-version.outputs.version }}.zip` 通过 Magisk 刷入
            - **Linux/macOS**: `tar xzf` 解压后运行 `./RustSync-*`
            - **Windows**: 解压后运行 `RustSync-${{ needs.get-version.outputs.version }}-windows-amd64.exe`
            - **Docker**: `docker-compose up -d`

            ### 默认
            - 端口: `8023`
            - 密码: `admin`
          files: ${{ steps.collect.outputs.files }}
          draft: false
          prerelease: false