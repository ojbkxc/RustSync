name: Magisk

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-magisk:
    name: 编译 Magisk 模块
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 获取版本号
        id: version
        run: |
          VERSION=$(cat rustsync/version.txt 2>/dev/null | head -1 | cut -d, -f1 | sed 's/^v//' || echo '0.5.0')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: rustsync/web/package-lock.json

      - name: 构建前端
        working-directory: rustsync/web
        run: |
          VERSION=${{ steps.version.outputs.version }}
          sed -i "s/__version_placeholder__/$VERSION/g" src/locales/zh-CN.yaml
          sed -i "s/__version_placeholder__/$VERSION/g" src/locales/en.yaml
          npm ci
          npm run build

      - name: 复制前端到 static
        run: |
          mkdir -p server/static
          cp -r rustsync/web/dist/* server/static/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk
          rustup target add aarch64-linux-android

      - name: 构建 Rust (aarch64)
        working-directory: server
        run: |
          cargo ndk --target aarch64-linux-android --platform 21 -- build --release
          mkdir -p ../dist/bin/arm64-v8a
          cp target/aarch64-linux-android/release/rustsync-server ../dist/bin/arm64-v8a/rustsync_server

      - name: 验证 Rust 二进制
        run: |
          file dist/bin/arm64-v8a/rustsync_server
          test -f dist/bin/arm64-v8a/rustsync_server

      - name: 打包 Magisk 模块
        run: |
          VERSION=${{ steps.version.outputs.version }}
          MAGISK_TMP=$(mktemp -d)
          cp module.prop customize.sh service.sh "$MAGISK_TMP/"
          cp -r META-INF "$MAGISK_TMP/"

          mkdir -p "$MAGISK_TMP/system/bin"
          cp dist/bin/arm64-v8a/rustsync_server "$MAGISK_TMP/system/bin/rustsync_server"

          mkdir -p "$MAGISK_TMP/static"
          cp -r server/static/* "$MAGISK_TMP/static/"

          sed -i "s/^version=.*/version=${VERSION}/" "$MAGISK_TMP/module.prop"
          VERSION_CODE=$(echo "$VERSION" | tr -d '.')
          sed -i "s/^versionCode=.*/versionCode=${VERSION_CODE}/" "$MAGISK_TMP/module.prop"

          (cd "$MAGISK_TMP" && zip -qr "$GITHUB_WORKSPACE/RustSync-magisk-${VERSION}.zip" .)
          rm -rf "$MAGISK_TMP"
          echo "Magisk: RustSync-magisk-${VERSION}.zip"

      - name: 上传 Magisk artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustSync-Magisk
          path: RustSync-magisk-*.zip
          if-no-files-found: error
          retention-days: 7

  # 只在 tag 推送时发布 Release
  create-release:
    name: 发布 Magisk Release
    runs-on: ubuntu-latest
    needs: [build-magisk]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: 获取版本号
        id: version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_VERSION#v}
          echo "tag=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 下载 Magisk artifact
        uses: actions/download-artifact@v4
        with:
          name: RustSync-Magisk
          path: dist

      - name: 列出产物
        run: ls -la dist/

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: RustSync Magisk ${{ steps.version.outputs.tag }}
          body: |
            ## RustSync Magisk 模块 ${{ steps.version.outputs.version }}

            Android Magisk 模块，通过 Magisk 刷入后自动运行 RustSync 服务。

            ### 使用
            - 下载 `RustSync-magisk-${{ steps.version.outputs.version }}.zip`
            - 通过 Magisk 刷入
            - 重启后服务自动运行，访问 `http://127.0.0.1:8023`

            ### 默认
            - 端口: `8023`
            - 密码: `admin`
          files: dist/RustSync-magisk-*.zip
          draft: false
          prerelease: false
