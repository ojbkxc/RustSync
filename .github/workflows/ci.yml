name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Get version
        id: version
        run: |
          VERSION=$(cat rustsync/version.txt 2>/dev/null | head -1 | cut -d, -f1 | sed 's/^v//' || echo '0.4.0')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: rustsync/web/package-lock.json

      - name: Build frontend
        working-directory: rustsync/web
        run: |
          VERSION=${{ steps.version.outputs.version }}
          sed -i "s/__version_placeholder__/$VERSION/g" src/locales/zh-CN.yaml
          sed -i "s/__version_placeholder__/$VERSION/g" src/locales/en.yaml
          npm ci
          npm run build
          echo "Frontend built"

      - name: Prepare frontend for packaging
        run: |
          cd rustsync
          rm -rf front
          cp -r web/dist front
          test -f front/index.html
          echo "Frontend copied to front/"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: |
          # Download pre-built cargo-ndk binary instead of compiling from source
          curl -fsSL https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-gnu-v4.1.2.tgz -o /tmp/cargo-ndk.tgz
          tar xzf /tmp/cargo-ndk.tgz -C /tmp
          sudo cp /tmp/cargo-ndk-*/cargo-ndk /tmp/cargo-ndk-*/cargo-ndk-runner /tmp/cargo-ndk-*/cargo-ndk-env /tmp/cargo-ndk-*/cargo-ndk-test /usr/local/bin/
          sudo chmod +x /usr/local/bin/cargo-ndk /usr/local/bin/cargo-ndk-runner /usr/local/bin/cargo-ndk-env /usr/local/bin/cargo-ndk-test
          rustup target add aarch64-linux-android

      - name: Copy frontend to Rust static directory
        run: |
          mkdir -p server/static
          cp -r rustsync/front/* server/static/
          echo "Frontend copied to server/static/"

      - name: Build Rust server (aarch64)
        working-directory: server
        run: |
          cargo ndk --target aarch64-linux-android --platform 21 -- build --release
          mkdir -p ../system/bin
          cp target/aarch64-linux-android/release/rustsync-server ../system/bin/rustsync_server
          echo "Rust binary built: rustsync_server"

      - name: Package static files for Magisk
        run: |
          mkdir -p static
          cp -r rustsync/front/* static/
          echo "Static files packaged for Magisk module"

      - name: Verify build artifact
        run: |
          if [ ! -f "system/bin/rustsync_server" ]; then
            echo "::error::Rust 二进制构建产物不存在"
            exit 1
          fi
          echo "Rust 二进制已构建: system/bin/rustsync_server"
          if [ -d "static" ] && [ "$(ls -A static 2>/dev/null)" ]; then
            echo "前端静态文件已打包"
          fi
          echo "构建产物验证通过"

      - name: Package
        run: |
          VERSION=${{ steps.version.outputs.version }}
          zip -r RustSync-${VERSION}-ci.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".gitignore" \
            -x ".gitmodules" \
            -x "rustsync/*" \
            -x "server/src/*" \
            -x "server/target/*" \
            -x "server/Cargo.*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustSync-CI
          path: RustSync-*-ci.zip