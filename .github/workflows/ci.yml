name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Show taoSync source info
        run: |
          cd taosync
          echo "taoSync source (submodule)"
          if [ -e ".git" ]; then
            echo "Commit: $(git log --pretty=format:'%h' -1)"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: taosync/web/package-lock.json

      - name: Build frontend
        working-directory: taosync/web
        run: |
          VERSION=${{ steps.version.outputs.version }}
          sed -i "s/__version_placeholder__/$VERSION/g" src/locales/zh-CN.yaml
          sed -i "s/__version_placeholder__/$VERSION/g" src/locales/en.yaml
          npm ci
          npm run build
          echo "Frontend built"

      - name: Prepare frontend for packaging
        run: |
          cd taosync
          rm -rf front
          cp -r web/dist front
          test -f front/index.html
          echo "Frontend copied to front/"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build taosync with PyInstaller + StaticX (ARM64)
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "$(pwd)/taosync:/app" \
            -w /app \
            arm64v8/python:3.11-slim-bullseye \
            sh -c '
              set -e
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                zlib1g-dev \
                patchelf \
                binutils \
                zip
              rm -rf /var/lib/apt/lists/*

              python -m pip install --upgrade pip
              python -m pip install setuptools wheel scons hatchling
              python -m pip install --no-build-isolation "pyinstaller>=6,<7" staticx
              python -m pip install -r requirements.txt

              export LD_LIBRARY_PATH="/usr/local/lib:/usr/lib/aarch64-linux-gnu"
              python -m PyInstaller taoSync.spec \
                --distpath /app/dist/arm64 \
                --workpath /app/build/arm64 \
                --noconfirm

              staticx "/app/dist/arm64/taoSync" "/app/dist/arm64/taoSync_StaticX"
              mv -f "/app/dist/arm64/taoSync_StaticX" "/app/dist/arm64/taoSync"
              chmod 755 "/app/dist/arm64/taoSync"
              echo "taoSync built successfully"
            '

      - name: Copy binary to system directory
        run: |
          mkdir -p system/bin
          cp -f taosync/dist/arm64/taoSync system/bin/taosync
          chmod 755 system/bin/taosync
          echo "taoSync binary copied to system/bin/taosync"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk
          rustup target add aarch64-linux-android

      - name: Copy frontend to Rust static directory
        run: |
          mkdir -p server/static
          cp -r taosync/front/* server/static/
          echo "Frontend copied to server/static/"

      - name: Build Rust server (aarch64)
        working-directory: server
        run: |
          cargo ndk --target aarch64-linux-android --platform 21 -- build --release
          mkdir -p ../system/bin
          cp target/aarch64-linux-android/release/rustsync-server ../system/bin/rustsync_server
          echo "Rust binary built: rustsync_server"

      - name: Package Rust static files for Magisk
        run: |
          mkdir -p static
          cp -r taosync/front/* static/
          echo "Static files packaged for Magisk module"

      - name: Verify build artifact
        run: |
          if [ ! -f "system/bin/rustsync_server" ] && [ ! -f "system/bin/taosync" ]; then
            echo "::error::构建产物不存在 (Rust 和 Python 二进制均缺失)"
            exit 1
          fi
          if [ -f "system/bin/rustsync_server" ]; then
            echo "Rust 二进制已构建: system/bin/rustsync_server"
          fi
          if [ -f "system/bin/taosync" ]; then
            echo "Python 二进制已构建: system/bin/taosync"
          fi
          echo "构建产物验证通过"

      - name: Package
        run: |
          VERSION=${{ steps.version.outputs.version }}
          zip -r RustSync-Magisk-${VERSION}-ci.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".gitignore" \
            -x ".gitmodules" \
            -x "taosync/*" \
            -x "server/src/*" \
            -x "server/target/*" \
            -x "server/Cargo.*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustSync-Magisk-CI
          path: RustSync-Magisk-*-ci.zip