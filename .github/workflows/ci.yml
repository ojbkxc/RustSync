name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Get version
        id: version
        run: |
          VERSION=$(cat rustsync/version.txt 2>/dev/null | head -1 | cut -d, -f1 | sed 's/^v//' || echo '0.4.0')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: rustsync/web/package-lock.json

      - name: Build frontend
        working-directory: rustsync/web
        run: |
          VERSION=${{ steps.version.outputs.version }}
          sed -i "s/__version_placeholder__/$VERSION/g" src/locales/zh-CN.yaml
          sed -i "s/__version_placeholder__/$VERSION/g" src/locales/en.yaml
          npm ci
          npm run build
          echo "Frontend built"

      - name: Prepare frontend for packaging
        run: |
          cd rustsync
          rm -rf front
          cp -r web/dist front
          test -f front/index.html
          echo "Frontend copied to front/"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Copy frontend to Rust static directory
        run: |
          mkdir -p server/static
          cp -r rustsync/front/* server/static/
          echo "Frontend copied to server/static/"

      - name: Build Rust server (host target)
        working-directory: server
        run: |
          cargo build --release
          echo "Rust binary built successfully"

      - name: Verify build artifact
        run: |
          if [ ! -f "server/target/release/rustsync-server" ]; then
            echo "::error::Rust 二进制构建产物不存在"
            exit 1
          fi
          echo "Rust 二进制已构建: server/target/release/rustsync-server"
          echo "构建产物验证通过"