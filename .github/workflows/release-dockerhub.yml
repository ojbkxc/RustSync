name: Release to Docker Hub

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: '版本类型'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: '自定义版本号 (如 1.0.1)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  DOCKER_USER: ojbkxc
  DOCKER_NAME: rustsync

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: 'recursive'

      - name: Get current version
        id: get_version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          TAG_VERSION=${LATEST_TAG#v}

          if [ -f VERSION ]; then
            FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          else
            FILE_VERSION="0.0.0"
          fi

          function version_gt() { test "$(printf '%s\n' "$@" | sort -V | head -n 1)" != "$1"; }

          if version_gt "$FILE_VERSION" "$TAG_VERSION"; then
            VERSION="$FILE_VERSION"
          else
            VERSION="$TAG_VERSION"
          fi

          echo "current_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Calculate next version
        id: next_version
        env:
          VERSION_TYPE: ${{ github.event.inputs.version_type }}
          CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
        run: |
          if [ -n "$CUSTOM_VERSION" ]; then
            NEW_VERSION="$CUSTOM_VERSION"
          else
            VERSION="${{ steps.get_version.outputs.current_version }}"
            BASE_VERSION=$(echo "$VERSION" | sed 's/-.*$//')

            IFS='.' read -r -a version_parts <<< "$BASE_VERSION"
            MAJOR="${version_parts[0]:-0}"
            MINOR="${version_parts[1]:-0}"
            PATCH="${version_parts[2]:-0}"

            case "$VERSION_TYPE" in
              major)
                NEW_VERSION="$((MAJOR + 1)).0.0"
                ;;
              minor)
                NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
                ;;
              *)
                NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
                ;;
            esac
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update VERSION file
        run: |
          echo "${{ steps.next_version.outputs.new_version }}" > VERSION
          echo "${{ steps.next_version.outputs.new_tag }},latest" > rustsync/version.txt

      - name: Commit and create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add VERSION rustsync/version.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to ${{ steps.next_version.outputs.new_tag }} [skip ci]"
          fi

          NEW_TAG="${{ steps.next_version.outputs.new_tag }}"
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists, skipping tag creation"
          else
            git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
            git push origin HEAD:main "$NEW_TAG"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./rustsync/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/${{ env.DOCKER_NAME }}:${{ steps.next_version.outputs.new_tag }}
            ${{ env.DOCKER_USER }}/${{ env.DOCKER_NAME }}:${{ steps.next_version.outputs.new_version }}
            ${{ env.DOCKER_USER }}/${{ env.DOCKER_NAME }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.next_version.outputs.new_version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ steps.next_version.outputs.new_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
